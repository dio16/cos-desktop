[package]
name = "media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded local encoded media and representation identity; no Runtime acquisition or GPU ownership."

[dependencies]
desktop-protocol = { path = "../desktop-protocol" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Direct use of the PNG row reader for bounded, cancellable decoding (MP-IMG2).
# Same crate and version that `image` already pulls in, so nothing new enters the graph.
png = "0.18.1"
sha2 = "0.10.9"

[lints]
workspace = true

[dev-dependencies]
peak_alloc = "0.3.0"
