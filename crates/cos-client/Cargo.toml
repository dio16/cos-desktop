[package]
name = "cos-client"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Transport-independent COS observation/command client and scripted fixture provider."

[dependencies]
desktop-protocol = { path = "../desktop-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[lints.rust]
unsafe_code = "forbid"
