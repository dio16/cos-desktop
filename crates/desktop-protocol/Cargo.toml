[package]
name = "desktop-protocol"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Versioned Desktop/COS wire contract: projections, envelopes, negotiation and bounds."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
# CanonicalV1 requires NFC-normalised strings/keys (Runtime `contract-core`
# `canonical_json_v1`). crates.io source, same line the Runtime pins.
unicode-normalization = "0.1"

[lints.rust]
unsafe_code = "forbid"
