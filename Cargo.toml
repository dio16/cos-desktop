[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/desktop-gpui",
    "crates/ui-model",
    "crates/app-core",
    "crates/cos-client",
    "crates/desktop-protocol",
    "crates/media",
]

[profile.dev]
debug = 1
incremental = false

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
gpui = { git = "https://github.com/dio16/zed", rev = "bf1429a63e9d04fec0eb49464cb97bbfcb39d5e6", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/dio16/zed", rev = "bf1429a63e9d04fec0eb49464cb97bbfcb39d5e6", default-features = false }
