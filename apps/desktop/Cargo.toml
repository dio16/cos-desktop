[package]
name = "cos-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cos-desktop"
path = "src/main.rs"

[features]
default = []
r0-s2b-instrumentation = ["gpui/profiler", "desktop-gpui/r0-s2b-instrumentation"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
desktop-gpui = { path = "../../crates/desktop-gpui" }
app-core = { path = "../../crates/app-core" }
cos-client = { path = "../../crates/cos-client" }
desktop-protocol = { path = "../../crates/desktop-protocol" }

[dev-dependencies]
media = { path = "../../crates/media" }

[target.'cfg(windows)'.dev-dependencies]
filepath = "=0.2.0"

[lints]
workspace = true
