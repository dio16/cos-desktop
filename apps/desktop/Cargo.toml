[package]
name = "cos-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cos-desktop"
path = "src/main.rs"

[features]
default = []
r0-s2b-instrumentation = ["gpui/profiler", "desktop-gpui/r0-s2b-instrumentation"]
gpu-recovery-test = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
desktop-gpui = { path = "../../crates/desktop-gpui" }
app-core = { path = "../../crates/app-core" }
cos-client = { path = "../../crates/cos-client" }
desktop-protocol = { path = "../../crates/desktop-protocol" }
# Blocking plain-HTTP executor for the Runtime protocol transport.
# `default-features = false` keeps TLS (and every other optional feature) out:
# the only configured endpoint is a loopback development origin, and a real
# credential/TLS story is not implemented yet (IMPLEMENTATION_MASTER_PLAN
# §19.112). Enabling TLS here would silently change that boundary.
ureq = { version = "2.12", default-features = false }

[dev-dependencies]
media = { path = "../../crates/media" }
# The explicit Compare experiment uses the same selection state as the production shell.
ui-model = { path = "../../crates/ui-model" }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager (DPAPI-protected at rest) for the Desktop Runtime
# credential. `keyring` is a safe wrapper over the same Win32 Credential APIs;
# this crate forbids its own `unsafe`. `default-features = false` selects only
# the Windows backend (no Linux/macOS store, no TLS or async).
# See IMPLEMENTATION_MASTER_PLAN §19.115.
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dev-dependencies]
filepath = "=0.2.0"

[lints]
workspace = true
