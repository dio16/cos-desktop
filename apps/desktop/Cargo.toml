[package]
name = "cos-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cos-desktop"
path = "src/main.rs"

[features]
default = []
r0-s2b-instrumentation = ["gpui/profiler", "desktop-gpui/r0-s2b-instrumentation"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
desktop-gpui = { path = "../../crates/desktop-gpui" }
app-core = { path = "../../crates/app-core" }
cos-client = { path = "../../crates/cos-client" }
desktop-protocol = { path = "../../crates/desktop-protocol" }
# Blocking plain-HTTP executor for the Runtime protocol transport.
# `default-features = false` keeps TLS (and every other optional feature) out:
# the only configured endpoint is a loopback development origin, and a real
# credential/TLS story is not implemented yet (IMPLEMENTATION_MASTER_PLAN
# §19.112). Enabling TLS here would silently change that boundary.
ureq = { version = "2.12", default-features = false }

[dev-dependencies]
media = { path = "../../crates/media" }

[target.'cfg(windows)'.dev-dependencies]
filepath = "=0.2.0"

[lints]
workspace = true
